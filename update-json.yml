name: Update games.json

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

                  - name: Update games.json
        run: find . -type f -name "*.pck" -not -path "./.git/*" -printf "%f\n" | sort | jq -R -s 'split("\n") | map(select(length > 0))' > games.json

      - name: Commit games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "games.json zaten güncel."
            exit 0
          fi

          git commit -m "Update games.json"
          git push
