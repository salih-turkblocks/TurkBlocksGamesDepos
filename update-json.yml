name: Update games.json

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: games.json oluştur
        shell: bash
        run: |
          echo "PCK dosyaları aranıyor..."

          find . -type f -name "*.pck" \
            -not -path "./.git/*" \
            -printf "%f\n" \
            | sort \
            | jq -R -s 'split("\n") | map(select(length > 0))' > games.json

          echo "Oluşturulan games.json:"
          cat games.json

      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "games.json zaten güncel."
            exit 0
          fi

          git commit -m "Auto-update games.json"
          git push
